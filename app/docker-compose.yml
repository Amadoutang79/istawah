version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istawah_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [istawah]

  web:
    image: nginx:alpine
    container_name: istawah_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [istawah]

  db:
    image: mysql:8.0
    container_name: istawah_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: istawah
      MYSQL_USER: istawah
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [istawah]

volumes:
  db_data:

networks:
  istawah: